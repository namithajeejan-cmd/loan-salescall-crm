<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Admin View</title>
  <style>
    body { margin: 0; background: #dfe3e8; font-family: Arial, sans-serif; text-align: center; }
    .phone { width: 390px; height: 780px; max-width: 100%; margin: 16px auto; border: 12px solid #222;
             border-radius: 36px; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; }
    @media (max-width: 500px) {
      .phone { border: 0; border-radius: 0; height: 100vh; margin: 0; }
      p { display: none; }
    }
  </style>
</head>
<body>
  <p>Mobile Admin UI. Log in as admin inside the phone.</p>
  <div class="phone"><iframe src="{% url 'admin_login' %}"></iframe></div>
</body>
</html>
